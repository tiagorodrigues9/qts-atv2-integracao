<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechCare - Gestão de Ordens de Serviço e Validação de Garantia">
  <title>{% block title %}TechCare - Gestão de Ordens de Serviço{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Skip Link para Acessibilidade WCAG 2.1 AA -->
  <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

  <!-- Cabeçalho Principal -->
  <header class="header" role="banner">
    <div class="header-container">
      <div>
        <h1 class="brand-title">TechCare OS</h1>
        <p class="brand-subtitle">Gestão de Ordens de Serviço &amp; Garantia de Equipamentos</p>
      </div>
      <nav aria-label="Navegação do cabeçalho">
        <span class="badge badge-approved">Sistema Operacional</span>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main id="conteudo-principal" class="main-container" role="main">
    {% block content %}{% endblock %}
  </main>

  <!-- Rodapé -->
  <footer class="footer" role="contentinfo">
    <p>&copy; 2026 TechCare - Disciplina de Qualidade e Teste de Software (QTS) - FATEC</p>
  </footer>
</body>
</html>
