[project]
name = "atv2-integracao"
version = "0.1.0"
description = "TechCare - Sistema de Gestão de Ordens de Serviço com Testes de Integração, E2E, Acessibilidade e Carga"
readme = "README.md"
authors = [
    { name = "Tiago Rodrigues", email = "tr364634@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "axe-playwright-python>=0.1.8",
    "faker>=40.44.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "locust>=2.47.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "pytest-playwright>=0.10.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
atv2-integracao = "atv2_integracao.main:start"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: Testes de integração de API e serviços",
    "e2e: Testes ponta a ponta com Playwright e Page Object Model",
    "accessibility: Auditoria de acessibilidade WCAG 2.1 AA com Axe-core e navegação por teclado",
]
addopts = "-ra --strict-markers"
